---
# yaml-language-server: $schema=https://taskfile.dev/schema.json
version: "3"

# OpenTofu helpers. The bootstrap root owns the state backend; see
# terraform/BACKEND.md.
#
# Secrets come from task-level dotenv files at the repository root. A file
# is named for the consumer that resolves it, role first.
#
# Dotenv files at the repository root:
#
#   .env.tf: every OpenTofu task. Native names of its consumer:
#     TF_VAR_* for tofu, AWS_* for the S3 backend.
#   .env.account.ovh.tf: the OVH account credential. The bootstrap root
#     and `task ovh:cli` read it.
#
# A root-specific credential never enters a dotenv. It lives in the root's
# git-ignored *.local.auto.tfvars, which tofu resolves itself.
#
# Three traps. Task reads dotenv after its own requires check, so these
# tasks carry preconditions. Task resolves a dotenv path against the task's
# dir, so these tasks use tofu -chdir. Task skips a missing dotenv file
# without a word.

vars:
  # The only bridge line. The project id feeds the tofu variable and the
  # ovhcloud CLI, which read different native names.
  TF_ENV: 'TF_VAR_project_id="$OVH_CLOUD_PROJECT_SERVICE"'

  # OpenTofu roots, by path under terraform/. Keep the list explicit: the
  # categories hold roots and modules, so no tool may guess a root.
  TF_ROOTS:
    - bootstrap/ovh
    - bootstrap/pve/jarvis
    - proxmox/jarvis
    - bootstrap/truenas/gen8
    - truenas/gen8
    - rustfs/gen8
  TF_ROOT_TFVARS:
    map:
      bootstrap/ovh: ovh.local.auto.tfvars
      bootstrap/pve/jarvis: jarvis.local.auto.tfvars
      proxmox/jarvis: jarvis.local.auto.tfvars
      bootstrap/truenas/gen8: gen8.local.auto.tfvars
      truenas/gen8: gen8.local.auto.tfvars
      rustfs/gen8: gen8.local.auto.tfvars
  TF_TRUENAS_ROOTS: [bootstrap/truenas/gen8, truenas/gen8]
  TF_LOCAL_TEST_MODULES:
    - terraform/truenas/modules/dataset
    - terraform/rustfs/modules/buckets
  TF_TRUENAS_DATASET_MODULE: terraform/truenas/modules/dataset
  TF_RUSTFS_BUCKETS_MODULE: terraform/rustfs/modules/buckets
  TF_TEST_MODULES: [proxmox/modules/lxc, proxmox/modules/vm]

  # Per-root partial backend args. The shell expands the references at run
  # time. bootstrap owns the bucket, so it needs none. The shared OVH S3
  # facts live in terraform/backend.s3.ovh.hcl, reached relative to the
  # root. See BACKEND.md.
  TF_INIT_BACKEND:
    map:
      bootstrap/ovh: ""
      bootstrap/pve/jarvis: '-backend-config=../../../backend.s3.ovh.hcl -backend-config="bucket=$TF_VAR_bucket_name"'
      proxmox/jarvis: '-backend-config=../../backend.s3.ovh.hcl -backend-config="bucket=$TF_VAR_bucket_name"'
      bootstrap/truenas/gen8: >-
        -backend-config=../../../backend.s3.ovh.hcl
        -backend-config="bucket=$TF_VAR_bucket_name"
      truenas/gen8: >-
        -backend-config=../../backend.s3.ovh.hcl
        -backend-config="bucket=$TF_VAR_bucket_name"
      rustfs/gen8: >-
        -backend-config=../../backend.s3.ovh.hcl
        -backend-config="bucket=$TF_VAR_bucket_name"

tasks:
  fmt:
    desc: Format every Terraform file in the repository.
    cmd: tofu fmt -recursive terraform/

  fmt-check:
    desc: Check Terraform formatting without writing.
    cmd: tofu fmt -check -recursive terraform/

  lint:
    desc: Lint every OpenTofu root with tflint.
    dir: terraform
    cmd: tflint --recursive

  test:
    desc: Test the LXC and VM modules with mocked providers. No host contact.
    dir: terraform
    cmds:
      - for: { var: TF_TEST_MODULES, as: MODULE }
        cmd: tofu -chdir="{{.MODULE}}" init -backend=false -input=false
      - for: { var: TF_TEST_MODULES, as: MODULE }
        cmd: tofu -chdir="{{.MODULE}}" test {{.CLI_ARGS}}

  test-root-inputs:
    desc: Test Jarvis input contracts with mock providers. No host contact.
    preconditions:
      - sh: test -f terraform/proxmox/jarvis/.terraform/modules/modules.json
        msg: "Run task tf:init before testing the root inputs."
    cmd: >-
      tofu -chdir=terraform/proxmox/jarvis test
      -filter=tests/settings.tftest.hcl {{.CLI_ARGS}}

  test-pve-bootstrap:
    desc: Test the PVE access bootstrap with a mock provider. No host contact.
    preconditions:
      - sh: test -d terraform/bootstrap/pve/jarvis/.terraform/providers
        msg: "Run task tf:init before testing the access root."
    cmd: tofu -chdir=terraform/bootstrap/pve/jarvis test {{.CLI_ARGS}}

  test-truenas:
    desc: Test the TrueNAS module and roots. No host contact.
    preconditions:
      - sh: test -d terraform/bootstrap/truenas/gen8/.terraform/providers
        msg: "Run task tf:init before testing the bootstrap root."
      - sh: test -d terraform/truenas/gen8/.terraform/providers
        msg: "Run task tf:init before testing the storage root."
      - sh: test -d {{.TF_TRUENAS_DATASET_MODULE}}/.terraform/providers
        msg: "Run task tf:init before testing the dataset module."
    cmds:
      - uv run python {{.TF_TRUENAS_DATASET_MODULE}}/tests/check_catalog_type.py
      - tofu -chdir="{{.TF_TRUENAS_DATASET_MODULE}}" test {{.CLI_ARGS}}
      - for:
          var: TF_TRUENAS_ROOTS
          as: ROOT
        cmd: tofu -chdir="terraform/{{.ROOT}}" test {{.CLI_ARGS}}

  test-rustfs:
    desc: Test the RustFS module and root with a mock provider. No host contact.
    preconditions:
      - sh: test -f terraform/rustfs/gen8/.terraform/modules/modules.json
        msg: "Run task tf:init before testing the RustFS root."
      - sh: test -d {{.TF_RUSTFS_BUCKETS_MODULE}}/.terraform/providers
        msg: "Run task tf:init before testing the RustFS module."
    cmds:
      - tofu -chdir="{{.TF_RUSTFS_BUCKETS_MODULE}}" test {{.CLI_ARGS}}
      - tofu -chdir="terraform/rustfs/gen8" test {{.CLI_ARGS}}

  init:
    desc: Initialize OpenTofu roots and test modules. Contacts remote backends.
    dotenv: [".env.tf"]
    preconditions:
      - sh: test -s .env.tf
        msg: ".env.tf is missing or empty. Copy .env.tf.example and fill it."
    cmds:
      - for: { var: TF_ROOTS, as: ROOT }
        cmd: env {{.TF_ENV}} tofu -chdir="terraform/{{.ROOT}}" init -input=false {{index .TF_INIT_BACKEND .ROOT}}
      - for:
          var: TF_LOCAL_TEST_MODULES
          as: MODULE
        cmd: tofu -chdir="{{.MODULE}}" init -backend=false -input=false

  validate:
    desc: Validate every OpenTofu root. Runs init first.
    dotenv: [".env.tf"]
    preconditions:
      - sh: test -s .env.tf
        msg: ".env.tf is missing or empty. Copy .env.tf.example and fill it."
    cmds:
      - task: init
      - for: { var: TF_ROOTS, as: ROOT }
        cmd: env {{.TF_ENV}} tofu -chdir="terraform/{{.ROOT}}" validate -no-color

  test-commands:
    desc: Test Terraform commands with a fake CLI. No host contact.
    cmd: uv run python -m unittest discover -s tests -p test_tf_tasks.py

  ovh-bootstrap-plan:
    desc: Preview bootstrap/ovh. Contacts its API. Owner approval required.
    aliases: [bootstrap-plan]
    cmds:
      - task: _run-ovh
        vars: {ROOT: bootstrap/ovh, ACTION: plan}

  ovh-bootstrap-apply:
    desc: Apply bootstrap/ovh. Changes infrastructure. Owner approval required.
    aliases: [bootstrap-apply]
    cmds:
      - task: _run-ovh
        vars: {ROOT: bootstrap/ovh, ACTION: apply}

  ovh-bootstrap-output:
    desc: Read saved bootstrap/ovh outputs. Raw key outputs are secret.
    aliases: [bootstrap-output]
    cmds:
      - task: _run-ovh
        vars: {ROOT: bootstrap/ovh, ACTION: output}

  pve-jarvis-bootstrap-plan:
    desc: Preview PVE access on Jarvis. Owner approval required.
    aliases: [pve-jarvis-plan]
    cmds:
      - task: _run
        vars: {ROOT: bootstrap/pve/jarvis, ACTION: plan}

  pve-jarvis-bootstrap-apply:
    desc: Apply PVE access on Jarvis. Owner approval required.
    aliases: [pve-jarvis-apply]
    cmds:
      - task: _run
        vars: {ROOT: bootstrap/pve/jarvis, ACTION: apply}

  pve-jarvis-bootstrap-output:
    desc: Read saved bootstrap/pve/jarvis outputs. Raw key outputs are secret.
    aliases: [pve-jarvis-output]
    cmds:
      - task: _run
        vars: {ROOT: bootstrap/pve/jarvis, ACTION: output}

  proxmox-jarvis-plan:
    desc: Preview proxmox/jarvis. Contacts its API. Owner approval required.
    aliases: [jarvis-plan]
    cmds:
      - task: _run
        vars: {ROOT: proxmox/jarvis, ACTION: plan}

  proxmox-jarvis-apply:
    desc: Apply proxmox/jarvis. Changes infrastructure. Owner approval required.
    aliases: [jarvis-apply]
    cmds:
      - task: _run
        vars: {ROOT: proxmox/jarvis, ACTION: apply}

  proxmox-jarvis-output:
    desc: Read saved proxmox/jarvis outputs. Raw key outputs are secret.
    aliases: [jarvis-output]
    cmds:
      - task: _run
        vars: {ROOT: proxmox/jarvis, ACTION: output}

  truenas-gen8-bootstrap-plan:
    desc: Preview the TrueNAS Gen8 bootstrap. Owner approval required.
    cmds:
      - task: _run
        vars: {ROOT: bootstrap/truenas/gen8, ACTION: plan}

  truenas-gen8-bootstrap-apply:
    desc: Apply the TrueNAS Gen8 bootstrap. Owner approval required.
    cmds:
      - task: _run
        vars: {ROOT: bootstrap/truenas/gen8, ACTION: apply}

  truenas-gen8-bootstrap-output:
    desc: Read saved bootstrap/truenas/gen8 outputs. Raw key outputs are secret.
    cmds:
      - task: _run
        vars: {ROOT: bootstrap/truenas/gen8, ACTION: output}

  truenas-gen8-plan:
    desc: Preview truenas/gen8. Contacts its API. Owner approval required.
    cmds:
      - task: _run
        vars: {ROOT: truenas/gen8, ACTION: plan}

  truenas-gen8-apply:
    desc: Apply truenas/gen8. Changes infrastructure. Owner approval required.
    cmds:
      - task: _run
        vars: {ROOT: truenas/gen8, ACTION: apply}

  truenas-gen8-output:
    desc: Read saved truenas/gen8 outputs. Raw key outputs are secret.
    cmds:
      - task: _run
        vars: {ROOT: truenas/gen8, ACTION: output}

  rustfs-gen8-plan:
    desc: Preview rustfs/gen8. Contacts its API. Owner approval required.
    cmds:
      - task: _run
        vars: {ROOT: rustfs/gen8, ACTION: plan}

  rustfs-gen8-apply:
    desc: Apply rustfs/gen8. Changes infrastructure. Owner approval required.
    cmds:
      - task: _run
        vars: {ROOT: rustfs/gen8, ACTION: apply}

  rustfs-gen8-status:
    desc: Read live RustFS storage capacity. Owner approval required.
    cmd: rc {{.CLI_ARGS}} admin info storage gen8

  rustfs-gen8-quota:
    desc: Read a live RustFS bucket quota. Owner approval required.
    requires:
      vars: [BUCKET]
    cmd: rc {{.CLI_ARGS}} bucket quota info {{printf "gen8/%s" .BUCKET | q}}

  rustfs-gen8-output:
    desc: Read saved rustfs/gen8 outputs. Raw key outputs are secret.
    cmds:
      - task: _run
        vars: {ROOT: rustfs/gen8, ACTION: output}

  ovh-bootstrap-state-list:
    desc: List resources tracked in the OVH bootstrap state.
    aliases: [bootstrap-state-list]
    cmds:
      - task: _run
        vars: {ROOT: bootstrap/ovh, ACTION: state list}

  _run:
    internal: true
    requires:
      vars: [ROOT, ACTION]
    dotenv: [".env.tf"]
    vars: &root_command_vars
      ROOT_TFVARS: "{{index .TF_ROOT_TFVARS .ROOT}}"
      INPUT_FLAG: >-
        {{if or (eq .ACTION "plan") (eq .ACTION "apply")}}-input=false{{end}}
    preconditions:
      - &shared_env_required
        sh: test -s .env.tf
        msg: ".env.tf is missing or empty. Copy .env.tf.example and fill it."
      - &root_tfvars_required
        sh: >-
          {{if .INPUT_FLAG}}test -s "terraform/{{.ROOT}}/{{.ROOT_TFVARS}}"
          {{else}}true{{end}}
        msg: "Copy terraform/{{.ROOT}}/{{.ROOT_TFVARS}}.example and fill it."
    # The RustFS provider would otherwise prefer ambient credentials.
    cmd: >-
      {{if eq .ROOT "rustfs/gen8"}}
      env -u RUSTFS_ENDPOINT -u RUSTFS_USER -u RUSTFS_SECRET
      {{end}}
      tofu -chdir="terraform/{{.ROOT}}" {{.ACTION}}
      {{.INPUT_FLAG}} {{.CLI_ARGS}}

  # Keep account credentials scoped to the state-backend consumer.
  _run-ovh:
    internal: true
    requires:
      vars: [ROOT, ACTION]
    dotenv: [".env.tf", ".env.account.ovh.tf"]
    vars: *root_command_vars
    preconditions:
      - *shared_env_required
      - sh: test -s .env.account.ovh.tf
        msg: ".env.account.ovh.tf is missing or empty. Copy its .example and fill it."
      - *root_tfvars_required
    cmd: >-
      env {{.TF_ENV}} tofu -chdir="terraform/{{.ROOT}}" {{.ACTION}}
      {{.INPUT_FLAG}} {{.CLI_ARGS}}
