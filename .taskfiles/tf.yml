---
# yaml-language-server: $schema=https://taskfile.dev/schema.json
version: "3"

# OpenTofu helpers. The bootstrap root owns the state backend; see
# terraform/BACKEND.md.
#
# Secrets come from task-level dotenv files at the repository root. A file
# is named for the consumer that resolves it, role first.
#
# Dotenv files at the repository root:
#
#   .env.tf — every OpenTofu task. Native names of its consumer:
#     TF_VAR_* for tofu, AWS_* for the S3 backend.
#   .env.account.ovh.tf — the OVH account credential. The bootstrap root
#     and `task ovh:cli` read it.
#
# A root-specific credential never enters a dotenv. It lives in the root's
# git-ignored *.local.auto.tfvars, which tofu resolves itself.
#
# Three traps. Task reads dotenv after its own requires check, so these
# tasks carry preconditions. Task resolves a dotenv path against the task's
# dir, so these tasks use tofu -chdir. Task skips a missing dotenv file
# without a word.

vars:
  # The only bridge line. The project id feeds the tofu variable and the
  # ovhcloud CLI, which read different native names.
  TF_ENV: 'TF_VAR_project_id="$OVH_CLOUD_PROJECT_SERVICE"'

  # OpenTofu roots, by path under terraform/. Keep the list explicit: the
  # categories hold roots and modules, so no tool may guess a root.
  TF_ROOTS: [bootstrap/ovh, bootstrap/pve/jarvis, proxmox/jarvis]

  # Per-root partial backend args. The shell expands the references at run
  # time. bootstrap owns the bucket, so it needs none. The shared OVH S3
  # facts live in terraform/backend.s3.ovh.hcl, reached relative to the
  # root. See BACKEND.md.
  TF_INIT_BACKEND:
    map:
      bootstrap/ovh: ""
      bootstrap/pve/jarvis: '-backend-config=../../../backend.s3.ovh.hcl -backend-config="bucket=$TF_VAR_bucket_name"'
      proxmox/jarvis: '-backend-config=../../backend.s3.ovh.hcl -backend-config="bucket=$TF_VAR_bucket_name"'

tasks:
  fmt:
    desc: Format every Terraform file in the repository.
    cmd: mise exec -- tofu fmt -recursive terraform/

  fmt-check:
    desc: Check Terraform formatting without writing.
    cmd: mise exec -- tofu fmt -check -recursive terraform/

  lint:
    desc: Lint every OpenTofu root with tflint.
    dir: terraform
    cmd: mise exec -- tflint --recursive

  init:
    desc: Initialize every OpenTofu root. Contacts a remote backend when one exists.
    dotenv: [".env.tf"]
    preconditions:
      - sh: test -s .env.tf
        msg: ".env.tf is missing or empty. Copy .env.tf.example and fill it."
    cmds:
      - for: { var: TF_ROOTS, as: ROOT }
        cmd: mise exec -- env {{.TF_ENV}} tofu -chdir="terraform/{{.ROOT}}" init -input=false {{index .TF_INIT_BACKEND .ROOT}}

  validate:
    desc: Validate every OpenTofu root. Runs init first.
    dotenv: [".env.tf"]
    preconditions:
      - sh: test -s .env.tf
        msg: ".env.tf is missing or empty. Copy .env.tf.example and fill it."
    cmds:
      - task: init
      - for: { var: TF_ROOTS, as: ROOT }
        cmd: mise exec -- env {{.TF_ENV}} tofu -chdir="terraform/{{.ROOT}}" validate -no-color

  bootstrap-plan:
    desc: Plan the state backend.
    dotenv: [".env.tf", ".env.account.ovh.tf"]
    preconditions:
      - sh: test -s .env.tf
        msg: ".env.tf is missing or empty. Copy .env.tf.example and fill it."
      - sh: test -s .env.account.ovh.tf
        msg: ".env.account.ovh.tf is missing or empty. Copy its .example and fill it."
      - sh: test -s terraform/bootstrap/ovh/ovh.local.auto.tfvars
        msg: "terraform/bootstrap/ovh/ovh.local.auto.tfvars is missing. Copy its .example and fill it."
    cmds:
      - mise exec -- env {{.TF_ENV}} tofu -chdir=terraform/bootstrap/ovh plan

  bootstrap-apply:
    desc: Create the state bucket and the access chain. Idempotent.
    dotenv: [".env.tf", ".env.account.ovh.tf"]
    preconditions:
      - sh: test -s .env.tf
        msg: ".env.tf is missing or empty. Copy .env.tf.example and fill it."
      - sh: test -s .env.account.ovh.tf
        msg: ".env.account.ovh.tf is missing or empty. Copy its .example and fill it."
      - sh: test -s terraform/bootstrap/ovh/ovh.local.auto.tfvars
        msg: "terraform/bootstrap/ovh/ovh.local.auto.tfvars is missing. Copy its .example and fill it."
    cmds:
      - mise exec -- env {{.TF_ENV}} tofu -chdir=terraform/bootstrap/ovh apply {{.CLI_ARGS}}

  bootstrap-output:
    desc: Read one bootstrap output. Pass the args after -- (for example, -raw s3_secret_key).
    dotenv: [".env.tf", ".env.account.ovh.tf"]
    preconditions:
      - sh: test -s .env.tf
        msg: ".env.tf is missing or empty. Copy .env.tf.example and fill it."
      - sh: test -s .env.account.ovh.tf
        msg: ".env.account.ovh.tf is missing or empty. Copy its .example and fill it."
    cmds:
      - mise exec -- env {{.TF_ENV}} tofu -chdir=terraform/bootstrap/ovh output {{.CLI_ARGS}}

  bootstrap-state-list:
    desc: List resources tracked in the bootstrap state.
    dotenv: [".env.tf"]
    preconditions:
      - sh: test -s .env.tf
        msg: ".env.tf is missing or empty. Copy .env.tf.example and fill it."
    cmds:
      - mise exec -- env {{.TF_ENV}} tofu -chdir=terraform/bootstrap/ovh state list

  pve-jarvis-plan:
    desc: Plan the jarvis PVE access root. Contacts the PVE node. Owner approval required.
    dotenv: [".env.tf"]
    preconditions:
      - sh: test -s .env.tf
        msg: ".env.tf is missing or empty. Copy .env.tf.example and fill it."
      - sh: test -s terraform/bootstrap/pve/jarvis/jarvis.local.auto.tfvars
        msg: "terraform/bootstrap/pve/jarvis/jarvis.local.auto.tfvars is missing. Copy its .example and fill it."
    cmds:
      - mise exec -- tofu -chdir=terraform/bootstrap/pve/jarvis plan {{.CLI_ARGS}}

  pve-jarvis-apply:
    desc: Apply the jarvis PVE access root. Changes the PVE node. Owner approval required.
    dotenv: [".env.tf"]
    preconditions:
      - sh: test -s .env.tf
        msg: ".env.tf is missing or empty. Copy .env.tf.example and fill it."
      - sh: test -s terraform/bootstrap/pve/jarvis/jarvis.local.auto.tfvars
        msg: "terraform/bootstrap/pve/jarvis/jarvis.local.auto.tfvars is missing. Copy its .example and fill it."
    cmds:
      - mise exec -- tofu -chdir=terraform/bootstrap/pve/jarvis apply {{.CLI_ARGS}}

  pve-jarvis-output:
    desc: Read one jarvis access output. Pass the args after -- (for example, -raw token_value).
    dotenv: [".env.tf"]
    preconditions:
      - sh: test -s .env.tf
        msg: ".env.tf is missing or empty. Copy .env.tf.example and fill it."
    cmds:
      - mise exec -- tofu -chdir=terraform/bootstrap/pve/jarvis output {{.CLI_ARGS}}

  jarvis-plan:
    desc: Plan the jarvis root. Contacts the PVE node. Owner approval required.
    dotenv: [".env.tf"]
    preconditions:
      - sh: test -s .env.tf
        msg: ".env.tf is missing or empty. Copy .env.tf.example and fill it."
      - sh: test -s terraform/proxmox/jarvis/jarvis.local.auto.tfvars
        msg: "terraform/proxmox/jarvis/jarvis.local.auto.tfvars is missing. Copy jarvis.local.auto.tfvars.example and fill it."
    cmds:
      - mise exec -- tofu -chdir=terraform/proxmox/jarvis plan {{.CLI_ARGS}}

  jarvis-apply:
    desc: Apply the jarvis root. Changes the PVE node. Owner approval required.
    dotenv: [".env.tf"]
    preconditions:
      - sh: test -s .env.tf
        msg: ".env.tf is missing or empty. Copy .env.tf.example and fill it."
      - sh: test -s terraform/proxmox/jarvis/jarvis.local.auto.tfvars
        msg: "terraform/proxmox/jarvis/jarvis.local.auto.tfvars is missing. Copy jarvis.local.auto.tfvars.example and fill it."
    cmds:
      - mise exec -- tofu -chdir=terraform/proxmox/jarvis apply {{.CLI_ARGS}}

  jarvis-output:
    desc: Read one jarvis output. Pass the args after -- (for example, -json lxcs).
    dotenv: [".env.tf"]
    preconditions:
      - sh: test -s .env.tf
        msg: ".env.tf is missing or empty. Copy .env.tf.example and fill it."
    cmds:
      - mise exec -- tofu -chdir=terraform/proxmox/jarvis output {{.CLI_ARGS}}
