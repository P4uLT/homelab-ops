---
# yaml-language-server: $schema=https://taskfile.dev/schema.json
version: "3"

# OpenTofu helpers. The bootstrap root owns the state backend; see
# terraform/BACKEND.md. Real values live in .env, which mise loads.
# The .env names map to TF_VAR_ names here so they stay stable across
# tools. Preconditions catch a half-filled .env before OpenTofu runs.

tasks:
  fmt:
    desc: Format every Terraform file in the repository.
    cmd: mise exec -- tofu fmt -recursive terraform/

  fmt-check:
    desc: Check Terraform formatting without writing.
    cmd: mise exec -- tofu fmt -check -recursive terraform/

  lint:
    desc: Lint every OpenTofu root with tflint.
    dir: terraform
    cmd: mise exec -- tflint --recursive

  bootstrap-init:
    desc: Initialize the bootstrap root (downloads the OVH provider).
    dir: terraform/bootstrap
    preconditions:
      - sh: mise exec -- sh -c 'test ${#TF_STATE_PASSPHRASE} -ge 16'
        msg: "TF_STATE_PASSPHRASE is missing or too short. Fill it in .env (16 characters minimum)."
    cmds:
      - mise exec -- env TF_VAR_state_passphrase="$TF_STATE_PASSPHRASE" TF_VAR_project_id="$OVH_CLOUD_PROJECT_SERVICE" TF_VAR_bucket_name="$OVH_BUCKET" TF_VAR_region="$OVH_REGION" tofu init

  bootstrap-plan:
    desc: Plan the state backend. Needs the OVH_* values in .env.
    dir: terraform/bootstrap
    preconditions:
      - sh: mise exec -- sh -c 'test ${#TF_STATE_PASSPHRASE} -ge 16'
        msg: "TF_STATE_PASSPHRASE is missing or too short. Fill it in .env (16 characters minimum)."
      - sh: mise exec -- sh -c 'test -n "$OVH_CLOUD_PROJECT_SERVICE" && test -n "$OVH_BUCKET" && test -n "$OVH_REGION"'
        msg: "OVH_CLOUD_PROJECT_SERVICE, OVH_BUCKET, or OVH_REGION is missing. Fill all three in .env."
      - sh: mise exec -- sh -c 'test -n "$OVH_APPLICATION_KEY" && test -n "$OVH_CONSUMER_KEY"'
        msg: "OVH API credentials are missing. See docs/runbooks/bootstrap-tf-backend.md."
    cmds:
      - mise exec -- env TF_VAR_state_passphrase="$TF_STATE_PASSPHRASE" TF_VAR_project_id="$OVH_CLOUD_PROJECT_SERVICE" TF_VAR_bucket_name="$OVH_BUCKET" TF_VAR_region="$OVH_REGION" tofu plan

  bootstrap-apply:
    desc: Create the state bucket and its access chain. Idempotent.
    dir: terraform/bootstrap
    preconditions:
      - sh: mise exec -- sh -c 'test ${#TF_STATE_PASSPHRASE} -ge 16'
        msg: "TF_STATE_PASSPHRASE is missing or too short. Fill it in .env (16 characters minimum)."
      - sh: mise exec -- sh -c 'test -n "$OVH_CLOUD_PROJECT_SERVICE" && test -n "$OVH_BUCKET" && test -n "$OVH_REGION"'
        msg: "OVH_CLOUD_PROJECT_SERVICE, OVH_BUCKET, or OVH_REGION is missing. Fill all three in .env."
      - sh: mise exec -- sh -c 'test -n "$OVH_APPLICATION_KEY" && test -n "$OVH_CONSUMER_KEY"'
        msg: "OVH API credentials are missing. See docs/runbooks/bootstrap-tf-backend.md."
    cmds:
      - mise exec -- env TF_VAR_state_passphrase="$TF_STATE_PASSPHRASE" TF_VAR_project_id="$OVH_CLOUD_PROJECT_SERVICE" TF_VAR_bucket_name="$OVH_BUCKET" TF_VAR_region="$OVH_REGION" tofu apply

  bootstrap-state-list:
    desc: List resources tracked in the bootstrap state.
    dir: terraform/bootstrap
    preconditions:
      - sh: mise exec -- sh -c 'test ${#TF_STATE_PASSPHRASE} -ge 16'
        msg: "TF_STATE_PASSPHRASE is missing or too short. Fill it in .env (16 characters minimum)."
    cmd: mise exec -- env TF_VAR_state_passphrase="$TF_STATE_PASSPHRASE" tofu state list
