---
# yaml-language-server: $schema=https://taskfile.dev/schema.json
version: "3"

# Golden LXC images. Formatting and validation stay offline. Build tasks
# contact the selected PVE node and need owner approval.

vars:
  PKR_BACKENDS: [proxmox-lxc]
  PKR_RECIPES:
    sh: find packer/images -mindepth 3 -maxdepth 3 -type f -path '*/lxc/*.pkrvars.hcl' -printf '%P\n' | sed 's/\.pkrvars\.hcl$//' | LC_ALL=C sort

tasks:
  fmt:
    desc: Format every Packer file in the repository.
    cmd: packer fmt -recursive packer/

  fmt-check:
    desc: Check Packer formatting without writing.
    cmd: packer fmt -check -recursive packer/

  # The first run downloads the pinned plugin and needs network.
  # `task packer:init -- -force` deliberately reinstalls it.
  init:
    desc: Install missing plugins for implemented Packer backends.
    dir: packer
    cmds:
      - for: { var: PKR_BACKENDS, as: BACKEND }
        cmd: packer init {{.CLI_ARGS}} templates/{{.BACKEND}}

  check-recipe:
    internal: true
    dir: packer
    requires:
      vars: [RECIPE]
    preconditions:
      - sh: '{{if regexMatch "^[a-z0-9][a-z0-9-]*/lxc/[a-z0-9][a-z0-9-]*$" .RECIPE}}true{{else}}false{{end}}'
        msg: RECIPE must use the <os>/lxc/<product> format with safe lowercase names.
      - sh: test -f {{printf "images/%s.pkrvars.hcl" .RECIPE | shellQuote}}
        msg: Recipe images/{{.RECIPE}}.pkrvars.hcl doesn't exist.
      - sh: test -d templates/proxmox-lxc
        msg: Backend templates/proxmox-lxc doesn't exist.

  check-host:
    internal: true
    dir: packer
    requires:
      vars: [HOST]
    preconditions:
      - sh: '{{if regexMatch "^[a-z0-9][a-z0-9-]*$" .HOST}}true{{else}}false{{end}}'
        msg: HOST must be a safe lowercase name.
      - sh: test -f {{printf "hosts/%s.pkrvars.hcl" .HOST | shellQuote}}
        msg: Public node file hosts/{{.HOST}}.pkrvars.hcl doesn't exist.
      - sh: test -f {{printf "hosts/%s.local.pkrvars.hcl" .HOST | shellQuote}}
        msg: Private node file hosts/{{.HOST}}.local.pkrvars.hcl doesn't exist.

  validate:
    desc: Discover and validate every supported LXC recipe offline. Runs init first.
    preconditions:
      - sh: test -n {{.PKR_RECIPES | shellQuote}}
        msg: No Packer LXC recipes were found.
    cmds:
      - task: init
      - for: { var: PKR_RECIPES, as: RECIPE }
        task: validate-recipe
        vars:
          RECIPE: '{{.RECIPE}}'

  validate-recipe:
    internal: true
    dir: packer
    requires:
      vars: [RECIPE]
    cmds:
      - task: check-recipe
        vars:
          RECIPE: '{{.RECIPE}}'
      - cmd: >-
          packer validate
          -var 'pve_ssh_host=validate.invalid'
          -var 'pve_ssh_user=validate'
          -var 'pve_ssh_password=validate'
          -var 'build_id=20261012T220000Z-11111111-1111-4111-8111-111111111111'
          -var 'source_revision=556d114223c949e0bbd55f48c6e106d1bcd7c3b4'
          -var {{printf "manifest_path=%s/packer/manifests/validate/%s/packer.json" .ROOT_DIR (replace "/" "-" .RECIPE) | shellQuote}}
          -var-file=images/{{.RECIPE}}.pkrvars.hcl
          -var-file=hosts/jarvis.pkrvars.hcl
          templates/proxmox-lxc

  build-recipe:
    internal: true
    dir: packer
    requires:
      vars: [RECIPE, HOST]
    vars:
      BUILD_TIMESTAMP:
        sh: date -u +%Y%m%dT%H%M%SZ
      BUILD_ID: '{{.BUILD_TIMESTAMP}}-{{uuid}}'
      SOURCE_REVISION:
        sh: git rev-parse HEAD
    cmds:
      - task: check-recipe
        vars:
          RECIPE: '{{.RECIPE}}'
      - cmd: mkdir -p manifests/{{.BUILD_ID}}
      - cmd: >-
          packer build
          -only=proxmox-lxc.image
          -var-file=hosts/{{.HOST}}.pkrvars.hcl
          -var-file=hosts/{{.HOST}}.local.pkrvars.hcl
          -var-file=images/{{.RECIPE}}.pkrvars.hcl
          -var build_id={{.BUILD_ID | shellQuote}}
          -var source_revision={{.SOURCE_REVISION | shellQuote}}
          -var {{printf "manifest_path=%s/packer/manifests/%s/packer.json" .ROOT_DIR .BUILD_ID | shellQuote}}
          {{.CLI_ARGS}}
          templates/proxmox-lxc

  build:
    desc: Build one image recipe on one PVE node. Owner approval required.
    requires:
      vars: [RECIPE, HOST]
    cmds:
      - task: check-recipe
        vars:
          RECIPE: '{{.RECIPE}}'
      - task: check-host
        vars:
          HOST: '{{.HOST}}'
      - task: init
      - task: :ansible:deps
      - task: :ansible:galaxy
      - task: build-recipe
        vars:
          RECIPE: '{{.RECIPE}}'
          HOST: '{{.HOST}}'
          CLI_ARGS: '{{.CLI_ARGS}}'

  build-all:
    desc: Build every discovered LXC recipe on one PVE node. Owner approval required.
    requires:
      vars: [HOST]
    preconditions:
      - sh: test -n {{.PKR_RECIPES | shellQuote}}
        msg: No Packer LXC recipes were found.
    cmds:
      - task: check-host
        vars:
          HOST: '{{.HOST}}'
      - task: init
      - task: :ansible:deps
      - task: :ansible:galaxy
      - for: { var: PKR_RECIPES, as: RECIPE }
        task: build-recipe
        vars:
          RECIPE: '{{.RECIPE}}'
          HOST: '{{.HOST}}'
          CLI_ARGS: '{{.CLI_ARGS}}'
