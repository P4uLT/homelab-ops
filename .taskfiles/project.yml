---
# yaml-language-server: $schema=https://taskfile.dev/schema.json
version: "3"

# Project-level task aliases. Component tasks keep their own namespace.
tasks:
  default:
    desc: List project tasks
    silent: true
    cmd: task --list

  verify:
    desc: Verify the project locally (Ansible shell, Terraform and Packer checks)
    cmds:
      - task: conventions
      - task: docs:check
      - task: docs:links
      - task: ansible:verify
      - task: tf:fmt-check
      - task: tf:lint
      - task: tf:validate
      - task: packer:fmt-check
      - task: packer:validate

  conventions:
    desc: Check the conventions no tool enforces (a tool keeps its own name)
    # A taskfile that routes a tool through the mise prefix duplicates what the
    # shell already carries, and hides which tool the line runs. The prefix
    # belongs to an invocation, not to a file. See docs/writing.md.
    # project.yml stays out: this guard's own pattern would match itself.
    cmd: '! grep -rq "mise exec" --exclude=project.yml .taskfiles/ Taskfile.yml'

  lint:
    desc: Lint the Ansible playbooks
    cmds:
      - task: ansible:lint

  run:
    desc: Run the local Ansible verification playbook
    cmds:
      - task: ansible:run
