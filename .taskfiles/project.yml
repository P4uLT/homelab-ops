---
# yaml-language-server: $schema=https://taskfile.dev/schema.json
version: "3"

# Project-level task aliases. Component tasks keep their own namespace.
tasks:
  default:
    desc: List project tasks
    silent: true
    cmd: task --list

  verify:
    desc: Verify the project locally (Ansible shell, Terraform format, lint, and validate)
    cmds:
      - task: ansible:verify
      - task: tf:fmt-check
      - task: tf:lint
      - task: tf:validate

  lint:
    desc: Lint the Ansible playbooks
    cmds:
      - task: ansible:lint

  run:
    desc: Run the local Ansible verification playbook
    cmds:
      - task: ansible:run
