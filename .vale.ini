# Prose linting. The rules are in docs/writing.md. Run it with task docs:check.
#
# The rules are vendored from the Google developer documentation style guide
# package (https://github.com/vale-cli/Google, MIT), so the check runs offline
# and the rule text isn't ours to maintain. Never edit those files: they're
# vendored, like roles/vendors/. The licence travels beside them.
#
# A rule file missing from the styles folder is ignored in silence. A rule
# named here without its YAML reports nothing and raises no error.
#
# Every enabled rule is raised to `error` on purpose. Vale fails the run only
# on an error alert, so a rule left at its shipped `suggestion` or `warning`
# level reports findings and still exits 0. A report that can't fail isn't a
# gate. The level a rule ships with is in its YAML.
#
# Only rules the house style already follows are enabled. A rule that fights
# this repository doesn't belong in a gate: the full package reports 339
# findings here, mostly Acronyms (159) and Parens (60), which contradict
# AGENTS.md.
#
# Update: vale sync, then copy the changed files from the sync
# target into .vale/styles/Google/ before committing.

StylesPath = .vale/styles
MinAlertLevel = suggestion

# The project vocabulary, at .vale/styles/config/vocabularies/House/. It's what
# lets Acronyms stay enabled: the terms it accepts are the domain vocabulary.
# An entry also fixes that term's casing, so never accept a word that's also
# ordinary English.
Vocab = House

[*.md]
# Vale.Terms enforces the exact casing of every vocabulary entry. Vale.Spelling
# needs a dictionary and reports 155 findings without one, so it stays off.
BasedOnStyles = Vale
Vale.Terms = error
Vale.Spelling = NO

Google.EmDash = error
Google.Semicolons = error
Google.Contractions = error
Google.Timeless = error
Google.ExcessiveClaims = error
Google.Latin = error
Google.Spelling = error
Google.Anthropomorphism = error
Google.Acronyms = error
Std.Readability.SentenceLength = error
House.NoMisePrefix = error

# Code comments get the same rules, minus the two that read words rather than
# prose. In a config file the same letters are identifiers, paths, and commands,
# so Acronyms and Vale.Terms fire on `pve/`, `ssh`, and `ovh_application_key`:
# 338 of the 401 findings the full set reports here, all false.
[*.{yml,yaml,toml,tf,hcl,cfg,ini,sh,example}]
Google.EmDash = error
Google.Semicolons = error
Google.Contractions = error
Google.Timeless = error
Google.ExcessiveClaims = error
Google.Latin = error
Google.Spelling = error
Google.Anthropomorphism = error
Std.Readability.SentenceLength = error
House.NoMisePrefix = error

# Exemptions for the prefix rule: the two pages that teach the fallback. Their
# literal is the lesson, not a violation. The rule files need no section: the
# docs:check task keeps .vale/ out of the linted list.
[AGENTS.md]
House.NoMisePrefix = NO

[docs/writing.md]
House.NoMisePrefix = NO
