# Prose linting. The rules and checks are documented in docs/writing.md.
# Google rules are vendored unchanged with their license beside them.
# A named rule without its YAML file is ignored, so retain the rule files.
# Blocking House, Google, Std, and Vale checks use the error level.

StylesPath = .vale/styles
MinAlertLevel = suggestion
Vocab = House

[*.md]
BasedOnStyles = Vale
Vale.Terms = error
Vale.Spelling = NO

Google.EmDash = error
Google.Semicolons = error
Google.Contractions = error
Google.Timeless = error
Google.ExcessiveClaims = error
Google.Latin = error
Google.Spelling = error
Google.Anthropomorphism = error
Google.Acronyms = error
Std.Readability.SentenceLength = error
House.NoMisePrefix = error

# Code comments use the prose checks without word-based identifier checks.
[*.{yml,yaml,toml,tf,hcl,cfg,ini,sh,example}]
Google.EmDash = error
Google.Semicolons = error
Google.Contractions = error
Google.Timeless = error
Google.ExcessiveClaims = error
Google.Latin = error
Google.Spelling = error
Google.Anthropomorphism = error
Std.Readability.SentenceLength = error
House.NoMisePrefix = error

# These pages document the shell fallback itself.
[AGENTS.md]
House.NoMisePrefix = NO

[docs/writing.md]
House.NoMisePrefix = NO

# These Ansible state choices are code literals, not time-based documentation.
[ansible/roles/local/apt/{meta/argument_specs,tasks/unattended_upgrades}.yml]
Google.Timeless = NO
