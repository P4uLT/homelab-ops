# Prose linting. The rules are in docs/writing.md. Run it with task docs:check.
#
# The eight rules are vendored from the Google developer documentation style
# guide package (https://github.com/vale-cli/Google, MIT), so the check runs
# offline and the rule text is not ours to maintain. Never edit those files:
# they are vendored, like roles/vendors/. The licence travels beside them.
#
# Only rules the house style already follows are enabled. A rule that fights
# this repository does not belong in a gate: the full package reports 339
# findings here, mostly Acronyms (159) and Parens (60), which contradict
# AGENTS.md.
#
# Update: mise exec -- vale sync, then copy the changed files from the sync
# target into .vale/styles/Google/ before committing.

StylesPath = .vale/styles
MinAlertLevel = suggestion

[*.md]
Google.EmDash = YES
Google.Semicolons = YES
Google.Contractions = YES
Google.Timeless = YES
Google.ExcessiveClaims = YES
Google.Latin = YES
Google.Spelling = YES
Google.Anthropomorphism = YES
