# Ansible configuration — homelab-ops shell.
# Written for the pinned ansible-core 2.21 line (see pyproject.toml).
# Auto-discovered when running from ansible/. Every configured path
# resolves inside the shell. Nothing here requires hosts or credentials.
#
# Deliberately absent: privilege and secret settings. Connection targets
# and users come from the inventory (SOPS-encrypted). Host-key policy
# stays in the owner's ~/.ssh/config.
# Also never enable display_args_to_stdout or [diff] always: task
# arguments and diffs can carry secrets.

[defaults]

########################################
# Inventory and code paths
########################################

# Hosts and groups come from here.
inventory = inventory/servers

# Local content first, galaxy content last. vendors/ is git-ignored.
roles_path = roles/local:roles/profiles:roles/vendors
collections_path = collections/local:collections/vendors

########################################
# Plugins
########################################

# One local directory per plugin type.
action_plugins = plugins/action
callback_plugins = plugins/callback
connection_plugins = plugins/connection
filter_plugins = plugins/filter
lookup_plugins = plugins/lookup
library = plugins/modules
strategy_plugins = plugins/strategy
vars_plugins = plugins/vars

########################################
# Secrets and callbacks
########################################

# Decrypt *.sops.yaml files when Ansible loads variables.
vars_plugins_enabled = host_group_vars, community.sops.sops
# Task timings come from ansible.posix.profile_tasks.
callbacks_enabled = ansible.posix.profile_tasks
# Human-readable task results in yaml format.
callback_result_format = yaml

########################################
# Runtime destinations
########################################

# Everything lands under config/. Git ignores it all.
log_path = config/tmp/ansible.log
# Failed-play host lists enable @file.retry re-runs.
retry_files_enabled = True
retry_files_save_path = config/tmp/retry

########################################
# Task execution
########################################

# Python discovery stays silent.
interpreter_python = auto_silent
localhost_warning = False
# Fleet parallelism. Harmless with one host today.
forks = 20
# SSH connection timeout in seconds. LAN pets connect fast.
timeout = 30

########################################
# SSH connection
########################################

# Reuse SSH connections and keep project host keys out of ~/.ssh.
# Paths resolve from ansible/. config/known_hosts is git-ignored.
ssh_args = -o ControlMaster=auto -o ControlPersist=30m -o UserKnownHostsFile=config/known_hosts
control_path = config/tmp/ssh/%%h-%%p-%%r
# Push modules through the SSH session instead of SFTP per task.
# Safe here: root-to-root runs execute no sudo. PVE has no requiretty.
pipelining = True
