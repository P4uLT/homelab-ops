---
# yaml-language-server: $schema=https://taskfile.dev/schema.json
version: "3"

# Entry point for the Ansible shell. The real recipes live in the included
# taskfile, flattened into this namespace so `task ansible:verify` works
# from the repository root.
includes:
  shell:
    taskfile: .taskfiles/ansible/Taskfile.yaml
    flatten: true
