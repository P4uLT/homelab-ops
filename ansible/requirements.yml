---
# All vendor requirements: roles and collections, exact pins only.
# Installed to roles/vendors/ and collections/vendors/ (both git-ignored).
# Entry: task ansible:galaxy
roles:
  - name: lae.proxmox
    src: git+https://github.com/lae/ansible-role-proxmox.git
    version: v1.10.1
  # Docker Engine for the golden images and for any host that runs the
  # service. The house policy lives in each inventory's grp_services_docker
  # group_vars, on the role's native knob.
  - name: geerlingguy.docker
    version: 8.0.0
  # The fleet account: a user, its authorized keys, and its sudo options,
  # validated with visudo. The image build and the fleet both call it, and the
  # data lives in each inventory's group_vars.
  - name: robertdebock.users
    version: 6.1.8

collections:
  - name: community.sops
    version: 2.4.0
  # ansible.posix.profile_tasks: task timing callback.
  - name: ansible.posix
    version: 2.2.2
  # Required by lae.proxmox: modprobe and zfs modules.
  - name: community.general
    version: 13.4.0
  # proxmox_pct_remote: the image build reaches its container through the
  # PVE node with pct exec. The cattle runtime path reaches a clone over SSH,
  # through the fleet account the image carries.
  - name: community.proxmox
    version: 2.0.0
