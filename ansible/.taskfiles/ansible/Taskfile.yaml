---
# yaml-language-server: $schema=https://taskfile.dev/schema.json
version: "3"

# Recipes for the Ansible shell. Everything runs through the project-local
# uv environment — no global Ansible install, no source-repository venv.
tasks:
  deps:
    desc: Sync the project environment (uv)
    cmds:
      - uv sync

  galaxy:
    desc: Install pinned vendor roles and collections
    cmds:
      - uv run ansible-galaxy role install -r playbooks/main/role_requirements.yml -p roles/vendors --force
      - uv run ansible-galaxy collection install -r collections/requirements.yml -p collections/vendors --force

  syntax:
    desc: Syntax-check all playbooks
    cmds:
      - uv run ansible-playbook --syntax-check -i inventory/servers/static.yml playbooks/verify.yml
      - uv run ansible-playbook --syntax-check -i inventory/servers/static.yml playbooks/oper/sops_canary_check.yml
      - uv run ansible-playbook --syntax-check -i inventory/servers/static.yml playbooks/servers/stacks/proxmox/converge.yml

  lint:
    desc: Lint all playbooks with ansible-lint
    cmds:
      - uv run ansible-lint playbooks/

  run:
    desc: Run the verification playbook against localhost
    cmds:
      - uv run ansible-playbook -i inventory/servers/static.yml playbooks/verify.yml

  verify:
    desc: Verify the shell — deps, galaxy, syntax, lint, local run
    cmds:
      - task: deps
      - task: galaxy
      - task: syntax
      - task: lint
      - task: run

  converge-check:
    desc: Best-effort check-mode preview on jarvis (Gate 2) — NOT guaranteed read-only
    cmds:
      - uv run ansible-playbook -i inventory/servers/static.yml playbooks/servers/stacks/proxmox/converge.yml -l jarvis --check {{.CLI_ARGS}}

  converge:
    desc: Converge jarvis (Gates 3a/3b) — pass extra vars after --
    cmds:
      - uv run ansible-playbook -i inventory/servers/static.yml playbooks/servers/stacks/proxmox/converge.yml -l jarvis {{.CLI_ARGS}}
