---
# Group tree: topology only, no hosts here. Hosts live in hosts.yml
# and group variables in the adjacent group_vars/ directory.
# Names read grp_<scope>_<specifics>: the machine tree under grp_servers_*,
# the opt-in service memberships under grp_services_*.
all:
  children:
    grp_servers:
      children:
        grp_servers_proxmox:
          children:
            grp_servers_proxmox_jarvis:
        # The cattle family. The workload root fills it, one grp_tf_<host>
        # leaf per container, in the fragment it writes at apply time:
        # inventory/servers/iac.tf.<node>.yml. Empty until then.
        grp_tf:
        # The hosts we own and build by hand: they take the baseline. The
        # cattle and the appliances stay out of this family, so their place in
        # the tree is the exclusion.
        grp_baseline:
          children:
            grp_containers:
              children:
                # Containers built by hand in the PVE interface, outside the
                # Terraform and Packer chain. Empty until one joins.
                grp_lxc_manual:
    # Opt-in service groups. Not topology: a host joins one when it runs that
    # service. An empty group is a skipped play.
    grp_services_docker:
