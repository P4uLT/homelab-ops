---
# Group tree: topology only, no hosts here. Hosts live in hosts.yml
# and group variables in the adjacent group_vars/ directory.
# Names read grp_<scope>_<specifics>: the machine tree under grp_servers_*,
# the opt-in service memberships under grp_services_*.
all:
  children:
    grp_servers:
      children:
        # The workloads Terraform creates. Their image carries the baseline,
        # so they stay outside grp_owned. The workload root fills this family,
        # one grp_tf_<host> leaf per container, in the fragment it writes at
        # apply time: inventory/servers/iac.tf.<node>.yml. Empty until then.
        grp_tf:
        # The hosts we configure by hand: the Debian hosts and the appliances.
        grp_owned:
          children:
            # The Debian baseline: the account, the apt policy, and the
            # container settings.
            grp_baseline:
              children:
                grp_containers:
                  children:
                    # Containers built by hand in the PVE interface, outside
                    # the Terraform and Packer chain. Empty until one joins.
                    grp_lxc_manual:
            # The Proxmox nodes. Their own role owns the packages, so they
            # stay out of grp_baseline.
            grp_servers_proxmox:
              children:
                grp_servers_proxmox_jarvis:
    # Opt-in service groups. Not topology: a host joins one when it runs that
    # service. An empty group is a skipped play.
    grp_services_docker:
