---
# Group tree: topology only, no hosts here. Hosts live in hosts.yml
# and group variables in the adjacent group_vars/ directory.
# Names read grp_<scope>_<specifics>: the machine tree under grp_servers_*,
# the opt-in service memberships under grp_services_*.
all:
  children:
    grp_servers:
      children:
        # Terraform workloads carry their baseline in the image and remain
        # outside the mutable population. Their root adds one leaf per CT.
        grp_servers_immutable:
        # Hosts maintained through Ansible.
        grp_servers_mutable:
          children:
            # Mutable LXC workloads, with Debian package policy below.
            grp_servers_lxc:
              children:
                grp_servers_lxc_debian:
            # Proxmox nodes own their package policy.
            grp_servers_proxmox:
              children:
                grp_servers_proxmox_jarvis:
    # Opt-in service groups. Not topology: a host joins one when it runs that
    # service. An empty group is a skipped play.
    grp_services_docker:
