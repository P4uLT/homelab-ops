---
# Host membership only. One host per image, because a build provisions one
# image and the selection is a host limit, like every other run in this
# repository. Each builder lives in its image group, and one that installs a
# service joins that service group too. Packer passes the rest as extra
# variables: the node, the login, the key, the container id, and the image
# identity. `image_python_vmid` is deliberately absent here: the pinned CTID lives
# in the image HCL, so a missing extra variable fails loudly instead of aiming
# at another container.
grp_builders_base:
  hosts:
    builder-base:

grp_builders_docker:
  hosts:
    builder-docker:

grp_services_docker:
  hosts:
    builder-docker:
