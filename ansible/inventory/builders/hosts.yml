---
# The build containers. One host per image, because a build provisions one
# image and the selection is a host limit, like every other run in this
# repository. Packer passes the rest as extra variables: the node, the login,
# the key, the container id, and the image identity. `proxmox_vmid` is
# deliberately absent here: the pinned CTID lives in the image HCL, so a
# missing extra variable fails loudly instead of aiming at another container.
all:
  hosts:
    builder-base:
      ansible_connection: community.proxmox.proxmox_pct_remote
      ansible_python_interpreter: /usr/bin/python3

    builder-docker:
      ansible_connection: community.proxmox.proxmox_pct_remote
      ansible_python_interpreter: /usr/bin/python3
