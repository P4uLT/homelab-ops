---
# Group tree: no hosts here. Hosts live in hosts.yml and group variables in
# the adjacent group_vars/ directory. Names read grp_<scope>_<specifics>:
# the build containers under grp_builders_*, one leaf group per image, the way
# the fleet keeps one leaf group per node.
all:
  children:
    grp_builders:
      children:
        grp_builders_base:
        grp_builders_docker:
    # Opt-in service groups. A builder joins one when its image carries that
    # service. An empty group is a skipped play.
    grp_services_docker:
