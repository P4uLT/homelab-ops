---
# Every build container is reached the same way: the Proxmox plugin runs the
# module inside the container through pct exec. Packer adds the node, the
# login, the key, and the pinned CTID as extra variables.
ansible_connection: community.proxmox.proxmox_pct_remote
ansible_python_interpreter: /usr/bin/python3

# The image is built fresh, so it takes a safe upgrade. Each image declares
# its package list in its group_vars.
apt_upgrade: safe
