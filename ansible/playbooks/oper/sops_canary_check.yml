# code: language=ansible
---
# The shell's offline proof that secrets and inventory variables resolve. One
# file per check, each one runnable alone. Nothing here changes a managed
# host, and nothing here prints a value.
- name: Import the decryption check
  ansible.builtin.import_playbook: canary/decrypt.yml

- name: Import the inventory check
  ansible.builtin.import_playbook: canary/connection.yml
