# code: language=ansible
---
# Test the PVE API token the jarvis roots use. The requests use no_log.
- name: Test the Terraform credential against the PVE API
  hosts: grp_servers_proxmox
  # The API call runs on the controller: the token never ships to the node.
  connection: local
  gather_facts: false
  vars:
    # Relative to the ansible/ working directory of the task runner.
    jarvis_tfvars: ../terraform/proxmox/jarvis/jarvis.local.auto.tfvars
  tasks:
    - name: Read the token from the jarvis root tfvars
      ansible.builtin.set_fact:
        pve_api_token: >-
          {{ lookup('ansible.builtin.file', jarvis_tfvars)
             | regex_search('pve_api_token\s*=\s*"([^"]+)"', '\1') | first }}
      no_log: true

    - name: Request the node version with the token
      ansible.builtin.uri:
        url: "https://{{ ansible_host }}:8006/api2/json/version"
        method: GET
        headers:
          Authorization: "PVEAPIToken={{ pve_api_token }}"
        status_code: 200
        validate_certs: false  # PVE ships a self-signed certificate
      no_log: true
      register: pve_version_result
      changed_when: false

    - name: Assert the API answered with a version
      ansible.builtin.assert:
        that: pve_version_result.json.data.version is defined
        quiet: true
