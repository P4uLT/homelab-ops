---
# Test the new PVE API credential. The request uses no_log.
- name: Test the operator credential against the PVE API
  hosts: grp_servers_proxmox
  gather_facts: false
  tasks:
    - name: Request an API ticket with the new password
      ansible.builtin.uri:
        url: "https://{{ ansible_host }}:8006/api2/json/access/ticket"
        method: POST
        body_format: form-urlencoded
        body:
          username: "{{ pve_users[0].name }}"
          password: "{{ pve_users[0].password }}"
        status_code: 200
        validate_certs: false  # PVE web certificate is self-signed; ticket-only check
      no_log: true
      register: pve_ticket_result
      changed_when: false

    - name: Assert the API issued a ticket
      ansible.builtin.assert:
        that: pve_ticket_result.json.data.ticket is defined
        quiet: true
