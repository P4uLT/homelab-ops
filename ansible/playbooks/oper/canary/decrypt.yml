# code: language=ansible
---
# The canary proves the age key decrypted the inventory secrets. It runs on
# the controller and prints no value.
- name: SOPS canary proof
  hosts: localhost
  connection: local
  gather_facts: false
  tasks:
    - name: Assert the canary variable decrypted
      ansible.builtin.assert:
        that: sops_canary | default('') | length > 0
        quiet: true
