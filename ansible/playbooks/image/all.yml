# code: language=ansible
---
# Every build runs the same phases, in this order: the interpreter in, the
# image's own roles, the seal out. A build limits to one host, so only one
# content play matches and the others match nothing. The content aggregators
# follow the fleet's shape: baseline/ holds the chain root and the phases
# every build shares, services/ holds the images that add a service to it,
# stacks/ holds the images that ship a whole stack. The stacks aggregator
# carries a placeholder that matches nothing, the same trick as the monitoring
# layer, so the wiring stays complete until the first stack lands.
- name: Prepare the build container
  ansible.builtin.import_playbook: baseline/prologue.yml

- name: Import the baseline image
  ansible.builtin.import_playbook: baseline/all.yml

- name: Import the service images
  ansible.builtin.import_playbook: services/all.yml

- name: Import the stack images
  ansible.builtin.import_playbook: stacks/all.yml

- name: Seal the image
  ansible.builtin.import_playbook: baseline/seal.yml
