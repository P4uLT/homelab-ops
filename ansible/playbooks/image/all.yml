# code: language=ansible
---
# Each image uses the shared prepare and seal phases. Packer's host limit
# selects one recipe between them; the image groups are siblings, so Docker
# inherits its parent artifact through Packer rather than Ansible.
- name: Prepare the build container
  ansible.builtin.import_playbook: prepare.yml

- name: Import the base image recipe
  ansible.builtin.import_playbook: base.yml

- name: Import the service image recipes
  ansible.builtin.import_playbook: services/all.yml

- name: Import the stack image recipes
  ansible.builtin.import_playbook: stacks/all.yml

- name: Seal the image
  ansible.builtin.import_playbook: seal.yml
