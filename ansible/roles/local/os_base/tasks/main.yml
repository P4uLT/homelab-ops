# code: language=ansible
---
# The Debian baseline every image carries, and every non-cattle host that
# opts in. Standalone and re-runnable: no step depends on an earlier role.
- name: Refresh the package index and upgrade the system
  ansible.builtin.apt:
    update_cache: true
    upgrade: safe
    dpkg_options: force-confold

# curl fetches the repository keys of the images above, ca-certificates
# validates those fetches. Neither ships in the standard template.
- name: Install curl and ca-certificates without their recommendations
  ansible.builtin.apt:
    name:
      - curl
      - ca-certificates
    state: present
    install_recommends: false

- name: List the services
  ansible.builtin.service_facts:

# LXC runs no networkd. The wait unit only delays a clone boot. The unit may
# be absent, so the task is conditional rather than tolerant of failure.
- name: Disable the networkd wait unit
  ansible.builtin.systemd_service:
    name: systemd-networkd-wait-online.service
    enabled: false
    state: stopped
  when: "'systemd-networkd-wait-online.service' in ansible_facts.services"
