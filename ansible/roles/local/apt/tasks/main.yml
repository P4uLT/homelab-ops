---
- name: Validate the cache lifetime and service-start policy
  ansible.builtin.assert:
    that:
      - apt_cache_valid_time | int >= 0
      - apt_policy is none or (apt_policy is integer and apt_policy >= 0 and apt_policy <= 255)
    fail_msg: Use a nonnegative cache lifetime and a null or integer service-start policy between 0 and 255.
    quiet: true
  tags: always

- name: Configure requested APT settings
  ansible.builtin.import_tasks: config.yml
  tags:
    - system
    - apt
    - config
    - apt-config

- name: Prepare packages and explicit upgrades
  ansible.builtin.import_tasks: install.yml
  tags:
    - system
    - apt
    - install
    - apt-install

- name: Manage requested repositories and packages
  ansible.builtin.import_tasks: manage.yml
  tags:
    - system
    - apt
    - manage
    - apt-manage
