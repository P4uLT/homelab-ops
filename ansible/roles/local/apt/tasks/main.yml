---
# Population and prerequisite calls share mechanism, not upgrade policy.
- name: Validate the cache lifetime
  ansible.builtin.assert:
    that: apt_cache_valid_time | int >= 0
    fail_msg: Set apt_cache_valid_time to zero or a positive number.
    quiet: true

- name: Refresh the package index
  ansible.builtin.apt:
    update_cache: true
    cache_valid_time: "{{ apt_cache_valid_time }}"

- name: Apply the requested upgrade policy
  ansible.builtin.apt:
    upgrade: "{{ apt_upgrade }}"
    dpkg_options: force-confold
  when: apt_upgrade != 'no'

- name: Install the requested packages
  ansible.builtin.apt:
    name: "{{ apt_packages }}"
    state: present
    install_recommends: false
  when: apt_packages | length > 0
