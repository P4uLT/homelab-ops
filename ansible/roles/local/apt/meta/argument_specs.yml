---
argument_specs:
  main:
    short_description: Manage packages and upgrades on Debian-family hosts
    options:
      apt_cache_valid_time:
        type: int
        description: Cache lifetime in seconds. Zero forces a refresh.
        default: 3600
      apt_upgrade:
        type: str
        description: The upgrade mode to run on apply.
        choices: ['no', safe, full]
        default: 'no'
      apt_packages:
        type: list
        elements: str
        description: The packages to install, without their recommendations.
        default: []
