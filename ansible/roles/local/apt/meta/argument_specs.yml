---
argument_specs:
  main:
    short_description: Manage packages and upgrades on Debian-family hosts
    options:
      apt_cache_valid_time:
        type: int
        description: Cache lifetime in seconds. Zero forces a refresh.
        default: 3600
      apt_upgrade:
        type: str
        description: The upgrade mode to run on apply.
        choices: ["no", safe, full, dist]
        default: "no"
      apt_packages:
        type: list
        elements: raw
        description: Package names or native upstream dictionaries of package options.
        default: []
      apt_dependencies:
        type: list
        elements: str
        description: Packages required by APT operations.
        default: [python3-apt]
      apt_package_state:
        type: str
        choices: [present, latest, absent, build-dep, fixed]
        description: Default state for requested packages.
        default: present
      apt_install_recommends:
        type: bool
        description: Install recommendations for requested packages.
        default: false
      apt_manage_config:
        type: bool
        description: Manage the general and periodic global APT configuration.
        default: false
      apt_policy:
        type: raw
        description: Null leaves policy-rc.d untouched. An integer sets its exit status.
        default:
      apt_autoremove:
        type: bool
        description: Remove packages no longer needed as dependencies.
        default: false
      apt_autoclean:
        type: bool
        description: Clean cached packages no longer available for download.
        default: false
      apt_unattended_upgrades:
        type: bool
        description: Install and configure unattended upgrades.
        default: false
      apt_periodic:
        type: bool
        description: Enable periodic operations when global configuration is managed.
        default: false
      apt_repositories:
        type: list
        elements: dict
        description: Native upstream repository definitions.
        default: []
      apt_keys:
        type: list
        elements: dict
        description: Native upstream signing-key definitions.
        default: []
      apt_preferences:
        type: list
        elements: dict
        description: Native upstream package pinning definitions.
        default: []
      apt_deb_packages:
        type: list
        elements: str
        description: Local paths or URLs of Debian packages to install.
        default: []
      apt_remount_filesystems:
        type: list
        elements: str
        choices: [rootfs, tmpfs]
        description: Filesystems to remount around package operations.
        default: []
      apt_aptitude_solution_cost:
        type: list
        elements: str
        description: Aptitude solver cost priorities.
        default: []
      apt_unattended_upgrades_download_timer_override:
        type: raw
        description: Null leaves the download timer untouched. A dictionary sets overrides.
        default:
      apt_unattended_upgrades_upgrade_timer_override:
        type: raw
        description: Null leaves the upgrade timer untouched. A dictionary sets overrides.
        default:
