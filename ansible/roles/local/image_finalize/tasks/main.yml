---
# Seal after the final install and boot, which can recreate identity and caches.
- name: Require the build facts before sealing
  ansible.builtin.assert:
    that: ansible_facts.date_time.iso8601 is defined
    fail_msg: Gather facts for the build container before sealing the image.
    quiet: true

- name: Seal the clone identity
  ansible.builtin.import_tasks: identity.yml

- name: Record the image build
  ansible.builtin.copy:
    content: "{{ image_finalize_marker | to_nice_json }}\n"
    dest: /etc/image-build-info
    owner: root
    group: root
    mode: "0644"
  vars:
    image_finalize_marker:
      image: "{{ image_finalize_name }}"
      version: "{{ image_finalize_version }}"
      parent: "{{ image_finalize_parent }}"
      built: "{{ ansible_facts.date_time.iso8601 }}"

- name: Clean the package state
  ansible.builtin.import_tasks: packages.yml

- name: Verify the sealed identity
  ansible.builtin.import_tasks: verify.yml
