---
# raw bootstraps modules. The explicit shell keeps operators inside pct exec.
- name: Check for the module interpreter
  ansible.builtin.raw: >-
    /bin/sh -c 'test -x /usr/bin/python3 && echo present || echo missing'
  register: image_bootstrap_probe
  changed_when: false

- name: Bootstrap Python when missing
  ansible.builtin.raw: >-
    /bin/sh -c 'apt-get update &&
    apt-get -y install python3 python3-apt'
  when: image_bootstrap_probe.stdout is search('missing')
  changed_when: true

- name: Gather the build container facts
  ansible.builtin.setup:
    gather_subset:
      - "!devices"

- name: Verify the expected build container
  ansible.builtin.assert:
    that: ansible_facts.hostname == 'builder-' ~ (image_bootstrap_vmid | string)
    fail_msg: >-
      Connected to {{ ansible_facts.hostname }}, expected builder-{{ image_bootstrap_vmid }}.
      Check the container identifier and the image provisioner's input.
    quiet: true
